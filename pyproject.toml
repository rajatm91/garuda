[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garuda"
version = "2.0.0"
description = "Static security scan toolkit for open-source LLMs"
requires-python = ">=3.14"
dependencies = [
  "huggingface_hub>=2.2",
  "model-signing>=1.1.1",
  "modelaudit>=0.2.52",
  "picklescan>=1.0.5",
  "pip-audit>=2.10.1",
  "pyyaml>=6.0.3",
]

[project.scripts]
scan = "garuda.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1", "ruff>=0.17", "pyright>=1.1.414", "jsonschema>=4.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/garuda"]

[tool.pytest.ini_options]
markers = [
  "integration: end-to-end pipeline tests",
  "golden: golden-file HTML regression",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyright]
include = ["src", "tests"]
