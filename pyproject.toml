[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "os-llm-scan-toolkit"
version = "2.0.0"
description = "Static + behavioural scan toolkit for open-source LLMs"
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=0.24",
  "modelaudit>=0.1",
  "picklescan>=0.0.20",
  "pip-audit>=2.7",
  "pip-licenses>=4.4",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dynamic = ["garak>=0.9", "litellm>=1.40"]
local-serve = [
  "vllm>=0.5; sys_platform == 'linux'",
  "transformers>=4.42",
  "fastapi>=0.110",
  "uvicorn>=0.30",
]

[project.scripts]
scan = "os_llm_scan.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pyright>=1.1.370", "jsonschema>=4.22"]

[tool.hatch.build.targets.wheel]
packages = ["src/os_llm_scan"]

[tool.pytest.ini_options]
markers = [
  "integration: end-to-end pipeline tests",
  "golden: golden-file HTML regression",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
