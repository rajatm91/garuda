name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q   # unit + integration (tiny-model fixture)

  docker:
    name: Docker image (${{ matrix.target }}) + end-to-end scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [root, nonroot]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: garuda:${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Full pipeline in the image (modelaudit on Linux, semgrep, syft/grype/gitleaks)
      # against the committed tiny-model fixture; no network or HF token needed.
      - name: Scan tiny-model fixture
        run: |
          mkdir -p out && chmod 777 out   # nonroot runs as uid 1000, runner is 1001
          docker run --rm --network none \
            -v "$PWD/tests/fixtures/tiny-model":/models/tiny:ro \
            -v "$PWD/out":/scans/out \
            garuda:${{ matrix.target }} all --local-path /models/tiny --out /scans/out
          test -s out/reports/scan_results.sarif
          test -s out/reports/scan_report.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: tiny-model-scan-${{ matrix.target }}
          path: out/reports/
          if-no-files-found: ignore
