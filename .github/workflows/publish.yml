name: Publish image

# Weekly rebuild refreshes the baked-in grype CVE DB and semgrep rule packs.
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/**", "Dockerfile", "pyproject.toml", "uv.lock", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/garuda

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: root
            moving: latest
            suffix: ""
          - target: nonroot
            moving: nonroot
            suffix: "-nonroot"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.moving }}
            type=raw,value={{date 'YYYYMMDD'}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=sha,suffix=${{ matrix.suffix }}

      # Smoke-test before anything is pushed: offline end-to-end scan of the fixture.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: garuda:test
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          no-cache: ${{ github.event_name == 'schedule' }}   # weekly: fresh DB + rules
      - name: Scan tiny-model fixture
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --network none \
            -v "$PWD/tests/fixtures/tiny-model":/models/tiny:ro \
            -v "$PWD/out":/scans/out \
            garuda:test all --local-path /models/tiny --out /scans/out
          test -s out/reports/scan_results.sarif

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          no-cache: ${{ github.event_name == 'schedule' }}   # else arm64 reuses last week's DB layer
