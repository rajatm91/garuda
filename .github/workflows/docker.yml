name: Docker

# Build both image targets and run an offline end-to-end scan, only when something
# that goes into the image (or the smoke-test fixture) changes. Docs-only changes skip.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/fixtures/**"     # smoke-test input
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "src/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/fixtures/**"     # smoke-test input
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker image (${{ matrix.target }}) + end-to-end scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [root, nonroot]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: garuda:${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Full pipeline in the image (modelaudit on Linux, semgrep, syft/grype/gitleaks)
      # against the committed tiny-model fixture; no network or HF token needed.
      - name: Scan tiny-model fixture
        run: |
          mkdir -p out && chmod 777 out   # nonroot runs as uid 1000, runner is 1001
          docker run --rm --network none \
            -v "$PWD/tests/fixtures/tiny-model":/models/tiny:ro \
            -v "$PWD/out":/scans/out \
            garuda:${{ matrix.target }} all --local-path /models/tiny --out /scans/out
          test -s out/reports/scan_results.sarif
          test -s out/reports/scan_report.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: tiny-model-scan-${{ matrix.target }}
          path: out/reports/
          if-no-files-found: ignore
